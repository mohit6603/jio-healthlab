# Render Blueprint — one-click deploy for JIO Healthlab
# https://render.com/docs/blueprint-spec

databases:
  - name: healthlab-db
    plan: free
    databaseName: jio_healthlab
    user: healthlab

services:
  # ── Backend (FastAPI) ──────────────────────────────────
  - type: web
    name: jio-healthlab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthlab-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://jio-healthlab.onrender.com,https://jio-healthlab-api.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ── Frontend (React static site) ───────────────────────
  - type: web
    name: jio-healthlab
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jio-healthlab-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://jio-healthlab-api.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://jio-healthlab-api.onrender.com/health
      - type: rewrite
        source: /docs
        destination: https://jio-healthlab-api.onrender.com/docs
      - type: rewrite
        source: /openapi.json
        destination: https://jio-healthlab-api.onrender.com/openapi.json
      - type: rewrite
        source: /*
        destination: /index.html
