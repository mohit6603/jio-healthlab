# Host-level reverse proxy for a single-EC2 deployment.
#
# The container stack already runs an nginx that serves the SPA and proxies
# /api to the backend. This sits in front of it and owns the things a
# container should not: the public certificate, HTTP-to-HTTPS redirection,
# and rate limiting.
#
#   sudo cp deploy/nginx/healthlab.conf /etc/nginx/sites-available/healthlab
#   sudo ln -s /etc/nginx/sites-available/healthlab /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d healthlab.example.com
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limits. Login is separated because it is the endpoint worth brute
# forcing, and AI generation is separated because each request occupies a
# worker for tens of seconds on CPU.
limit_req_zone $binary_remote_addr zone=healthlab_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=healthlab_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=healthlab_ai:10m rate=20r/m;

upstream healthlab_web {
    server 127.0.0.1:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name healthlab.example.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name healthlab.example.com;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/healthlab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healthlab.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    # Only meaningful once the certificate is real and HTTPS is confirmed
    # working -- a wrong HSTS header is hard to undo in browsers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;

    # Generation on CPU takes tens of seconds; the default 60s would cut a
    # legitimate answer short.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Sign-in: slow enough to make credential stuffing impractical, generous
    # enough that a person mistyping a password is not locked out.
    location = /api/auth/login {
        limit_req zone=healthlab_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://healthlab_web;
    }

    # Generation is the expensive path.
    location ~ ^/api/(ai/chat|reports/[0-9]+/explain)$ {
        limit_req zone=healthlab_ai burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://healthlab_web;
    }

    location / {
        limit_req zone=healthlab_general burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://healthlab_web;
    }

    # The AI service and Qdrant are never proxied here. They are reachable
    # only on the container network; the browser talks to the API, which
    # talks to them.
}
