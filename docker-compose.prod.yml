# JIO HealthLab -- production overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes:
#   * MySQL and Qdrant are expected to be managed services (RDS, Qdrant Cloud),
#     so the local containers are not started.
#   * Only the web tier is published. The API, the AI service and the vector
#     store stay on the internal network.
#   * The AI service is never publicly reachable: the browser talks to the API,
#     which proxies to it.
#   * Secrets must come from the environment. The API refuses to start in
#     production while JWT_SECRET_KEY is still the development placeholder.
#
# Required in the environment:
#   ENVIRONMENT=production
#   DATABASE_URL, JWT_SECRET_KEY, SEED_ADMIN_PASSWORD
#   QDRANT_URL and, for Qdrant Cloud, QDRANT_API_KEY
#   BACKEND_CORS_ORIGINS, VITE_API_BASE_URL

services:
  # Managed externally in production. `replicas: 0` keeps the service defined
  # (so overrides stay readable) without starting a container.
  mysql:
    deploy:
      replicas: 0

  qdrant:
    deploy:
      replicas: 0

  ai-service:
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      QDRANT_URL: ${QDRANT_URL:?Set QDRANT_URL to your managed Qdrant endpoint}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
    depends_on: !reset []
    # Internal only. Nothing outside the compose network can reach it.
    ports: !reset []

  bootstrap:
    environment:
      ENVIRONMENT: production
      QDRANT_URL: ${QDRANT_URL:?Set QDRANT_URL to your managed Qdrant endpoint}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LLM_PROVIDER: none

  api:
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your managed database URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a strong random value}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set BACKEND_CORS_ORIGINS to your public origin}
      # Demo report rows are not wanted in production; users still seed so the
      # first administrator can sign in.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    depends_on: !reset []
    ports: !reset []

  web:
    restart: always
    ports:
      - "${WEB_PORT:-80}:8080"
