# nginx quirk: add_header directives are inherited from an outer level ONLY if
# the current level declares none of its own. A single `add_header Cache-Control`
# inside a location therefore drops every server-level security header.
#
# Keeping them in one file and including it in each location that sets its own
# header is the idiomatic way to avoid that, and means there is one place to
# change them.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
