server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the exact nginx version.
  server_tokens off;

  # Baseline security headers. CSP is strict because the bundle is
  # self-contained -- nothing needs to load from another origin.
  include /etc/nginx/conf.d/security-headers.conf;

  # Uploaded knowledge documents go through the API; keep a sane ceiling.
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CPU generation can take tens of seconds; the default 60s read timeout
    # would cut a legitimate answer short.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location = /health {
    proxy_pass http://api:8000/health;
  }

  location /docs {
    proxy_pass http://api:8000/docs;
  }

  location = /openapi.json {
    proxy_pass http://api:8000/openapi.json;
  }

  # Container healthcheck: served by nginx itself, so it reports on the web
  # tier rather than on the API behind it.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed assets are immutable; index.html must not be cached or a deploy
  # leaves browsers on a stale bundle.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
